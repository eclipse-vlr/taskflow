services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow_dev}
      POSTGRES_DB: taskflow
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.19.0
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://taskflow:${POSTGRES_PASSWORD:-taskflow_dev}@postgres:5432/taskflow?sslmode=disable&connect_timeout=5&statement_timeout=10000&lock_timeout=3000&x-statement-timeout=10000
      - -lock-timeout=10
    command: [up]

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TASKFLOW_HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://taskflow:${POSTGRES_PASSWORD:-taskflow_dev}@postgres:5432/taskflow?sslmode=disable
      TASKFLOW_DB_TIMEOUT: ${TASKFLOW_DB_TIMEOUT:-3s}
      TASKFLOW_DB_MAX_CONNS: ${TASKFLOW_DB_MAX_CONNS:-10}
      TASKFLOW_WORKERS: ${TASKFLOW_WORKERS:-4}
      TASKFLOW_POLL_INTERVAL: ${TASKFLOW_POLL_INTERVAL:-500ms}
    ports:
      - "127.0.0.1:${TASKFLOW_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 10
    stop_grace_period: 15s

  test:
    build:
      context: .
      target: verify
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgres://taskflow:${POSTGRES_PASSWORD:-taskflow_dev}@postgres:5432/taskflow?sslmode=disable

volumes:
  postgres_data:
